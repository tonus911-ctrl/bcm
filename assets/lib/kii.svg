<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Переход КИИ на российские ПАК без остановки бизнеса">
<rect width="640" height="330" fill="#FFFFFF"/>
<rect x="34" y="40" width="572" height="250" rx="14" fill="none" stroke="#1B3A5C" stroke-width="2.5"/>
<text x="58" y="76" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B3A5C">Переход КИИ на российские ПАК</text>
<text x="58" y="100" font-family="Inter, Arial, sans-serif" font-size="15" fill="#565A63">сроки · риски · план с откатом · учения</text>
