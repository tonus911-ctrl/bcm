<text x="133" y="152" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7A5E17" text-anchor="middle">Старая система</text>
<text x="133" y="174" font-family="Inter, Arial, sans-serif" font-size="14" fill="#565A63" text-anchor="middle">работает до окна</text>
<path d="M216 158 L242 158" stroke="#1B3A5C" stroke-width="2.4"/><path d="M252 158 L240 152 L240 164 Z" fill="#1B3A5C"/>
<rect x="260" y="122" width="150" height="72" rx="9" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="2"/>
<text x="335" y="152" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">Окно переезда</text>
<text x="335" y="174" font-family="Inter, Arial, sans-serif" font-size="14" fill="#565A63" text-anchor="middle">не дольше RTO</text>
<path d="M418 158 L444 158" stroke="#1B3A5C" stroke-width="2.4"/><path d="M454 158 L442 152 L442 164 Z" fill="#1B3A5C"/>
<rect x="462" y="122" width="120" height="72" rx="9" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="2"/>
<text x="522" y="152" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">Новая</text>
<text x="522" y="174" font-family="Inter, Arial, sans-serif" font-size="14" fill="#565A63" text-anchor="middle">или откат</text>
<rect x="58" y="212" width="524" height="52" rx="9" fill="#1B3A5C"/>
<text x="320" y="244" font-family="Inter, Arial, sans-serif" font-size="15" fill="#F5F1E8" text-anchor="middle">Переезд удался, если бизнес этого не заметил</text>
