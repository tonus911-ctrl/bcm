<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Безопасность и риски на рабочем месте: опасность, оценка, барьер">
<rect width="640" height="330" fill="#FFFFFF"/>
<rect x="34" y="40" width="572" height="250" rx="14" fill="none" stroke="#1B3A5C" stroke-width="2.5"/>
<text x="58" y="76" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B3A5C">Безопасность на рабочем месте</text>
<text x="58" y="100" font-family="Inter, Arial, sans-serif" font-size="15" fill="#565A63">опасность · оценка · барьер · поведение</text>
<rect x="58" y="122" width="160" height="72" rx="9" fill="#F5F1E8" stroke="#C9A94E" stroke-width="2"/>
<text x="138" y="152" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7A5E17" text-anchor="middle">Опасность</text>
<text x="138" y="174" font-family="Inter, Arial, sans-serif" font-size="14" fill="#565A63" text-anchor="middle">она есть всегда</text>
<path d="M226 158 L252 158" stroke="#1B3A5C" stroke-width="2.4"/><path d="M262 158 L250 152 L250 164 Z" fill="#1B3A5C"/>
<rect x="270" y="122" width="160" height="72" rx="9" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="2"/>
<text x="350" y="152" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">Оценка риска</text>
<text x="350" y="174" font-family="Inter, Arial, sans-serif" font-size="14" fill="#565A63" text-anchor="middle">вероятность и тяжесть</text>
<path d="M438 158 L464 158" stroke="#1B3A5C" stroke-width="2.4"/><path d="M474 158 L462 152 L462 164 Z" fill="#1B3A5C"/>
<rect x="482" y="122" width="100" height="72" rx="9" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="2"/>
<text x="532" y="152" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">Барьер</text>
<text x="532" y="174" font-family="Inter, Arial, sans-serif" font-size="14" fill="#565A63" text-anchor="middle">и меры</text>
<rect x="58" y="212" width="524" height="52" rx="9" fill="#1B3A5C"/>
<text x="320" y="244" font-family="Inter, Arial, sans-serif" font-size="15" fill="#F5F1E8" text-anchor="middle">Цепочку разрывает человек, который заметил и сказал</text>
</svg>
