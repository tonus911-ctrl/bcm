<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Словарь непрерывности бизнеса: термин и его расшифровка простыми словами"><rect width="640" height="330" fill="#FFFFFF"/><rect x="40" y="40" width="560" height="250" rx="14" fill="none" stroke="#1B3A5C" stroke-width="2.5"/><text x="62" y="74" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1B3A5C" text-anchor="start">Словарь</text><text x="152" y="74" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B564A" text-anchor="start">90 терминов простыми словами</text><rect x="62" y="96" width="516" height="58" rx="9" fill="#F4E7D3" stroke="#1B3A5C" stroke-width="2" opacity=".9"/><text x="84" y="122" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5C" text-anchor="start">RTO</text><text x="84" y="143" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B564A" text-anchor="start">за сколько часов процесс должен ожить</text><rect x="62" y="164" width="516" height="58" rx="9" fill="#F4E7D3" stroke="#1B3A5C" stroke-width="2" opacity=".9"/><text x="84" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5C" text-anchor="start">BIA</text><text x="84" y="211" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5B564A" text-anchor="start">что теряет бизнес за каждый день простоя</text><rect x="62" y="232" width="516" height="38" rx="9" fill="#C4571C"/><text x="84" y="257" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#FBE6D8" text-anchor="start">Аппетит к риску, единая точка отказа, кризисный штаб</text></svg>
