<text x="600" y="168" font-family="'Manrope','Figtree',Arial,sans-serif" font-size="20" font-weight="800" fill="#1B3A5C" text-anchor="start">People</text>
<text x="600" y="192" font-family="'Manrope','Figtree',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#565A63" text-anchor="start">know their roles</text>
