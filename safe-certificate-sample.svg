<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1131" width="1600" height="1131" role="img" aria-label="Образец именного сертификата программы по культуре безопасности и оценке рисков">
<defs>
  <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E3C778"/><stop offset=".5" stop-color="#B8912F"/><stop offset="1" stop-color="#8E6E1E"/>
  </linearGradient>
</defs>
<style>
  text{font-family:Georgia,'Times New Roman',serif}
  .mono{font-family:'Courier New',monospace}
</style>

<rect width="1600" height="1131" fill="#FDF8ED"/>
<rect x="14" y="14" width="1572" height="1103" fill="none" stroke="#1B3A5C" stroke-width="9"/>
<rect x="40" y="40" width="1520" height="1051" fill="none" stroke="#B8912F" stroke-width="2.5"/>
<g fill="#B8912F">
  <rect x="49" y="49" width="16" height="16" transform="rotate(45 57 57)"/>
  <rect x="1535" y="49" width="16" height="16" transform="rotate(45 1543 57)"/>
  <rect x="49" y="1066" width="16" height="16" transform="rotate(45 57 1074)"/>
  <rect x="1535" y="1066" width="16" height="16" transform="rotate(45 1543 1074)"/>
</g>

<!-- водяной знак: маяк, каждая часть прозрачна отдельно -->
<g fill="#1B3A5C" fill-opacity="0.05">
  <path d="M786 420 l28 0 16 350 -60 0z"/>
  <rect x="768" y="770" width="64" height="20"/>
  <circle cx="800" cy="404" r="20"/>
</g>

<!-- шапка -->
<circle cx="800" cy="118" r="38" fill="#FDF8ED" stroke="#B8912F" stroke-width="2.5"/>
<g fill="#1B3A5C">
  <path d="M794 106 l12 0 5 26 -22 0z"/><rect x="789" y="130" width="22" height="7"/><circle cx="800" cy="100" r="6"/>
</g>
<text x="712" y="206" font-size="46" fill="#1B3A5C">risk-place</text>
<text x="927" y="206" font-size="46" fill="#C4571C">.ru</text>
<text x="800" y="244" font-size="19" fill="#6B7280" text-anchor="middle">культура безопасности и оценка рисков на рабочем месте</text>
<line x1="560" y1="274" x2="778" y2="274" stroke="#B8912F" stroke-width="1.4"/>
<rect x="792" y="266" width="15" height="15" transform="rotate(45 800 274)" fill="#B8912F"/>
<line x1="822" y1="274" x2="1040" y2="274" stroke="#B8912F" stroke-width="1.4"/>

<!-- имя -->
<text x="800" y="338" font-size="25" fill="#5B564A" font-style="italic" text-anchor="middle">настоящим удостоверяет, что</text>
<text x="800" y="414" font-size="58" font-weight="700" fill="#1B3A5C" text-anchor="middle">Имя Фамилия</text>
<line x1="500" y1="444" x2="1100" y2="444" stroke="#D8CFB8" stroke-width="1.4"/>

<!-- программа -->
<text x="800" y="494" font-size="24" fill="#5B564A" text-anchor="middle">прошел программу и подтвердил знания</text>
<text x="800" y="558" font-size="40" font-weight="700" fill="#1B3A5C" text-anchor="middle">Культура безопасности</text>
<text x="800" y="608" font-size="40" font-weight="700" fill="#1B3A5C" text-anchor="middle">и оценка рисков на рабочем месте</text>
<text x="800" y="654" font-size="23" fill="#B8912F" text-anchor="middle">— S A F E —</text>

<text x="800" y="716" font-size="22" fill="#26263a" text-anchor="middle">пять модулей, тридцать глав, тесты по каждому модулю</text>
<text x="800" y="750" font-size="22" fill="#26263a" text-anchor="middle">и итоговая проверка знаний из пятнадцати вопросов</text>

<!-- три плашки, с запасом по ширине -->
<g fill="none" stroke="#B8912F" stroke-width="1.4">
  <rect x="440" y="790" width="250" height="48"/><rect x="706" y="790" width="188" height="48"/><rect x="910" y="790" width="250" height="48"/>
</g>
<text x="565" y="821" font-size="19" fill="#1B3A5C" text-anchor="middle">охрана труда</text>
<text x="800" y="821" font-size="19" fill="#1B3A5C" text-anchor="middle">ИСО 45001</text>
<text x="1035" y="821" font-size="19" fill="#1B3A5C" text-anchor="middle">оценка рисков</text>

<!-- печать -->
<g transform="translate(1370 950)">
  <circle r="98" fill="url(#seal)"/>
  <circle r="82" fill="none" stroke="#FDF8ED" stroke-width="2" stroke-dasharray="5 5"/>
  <text y="-8" font-size="34" font-weight="700" fill="#3A2E10" text-anchor="middle">SAFE</text>
  <text y="22" font-size="14" fill="#4A3B14" text-anchor="middle">именной</text>
  <text y="44" font-size="14" fill="#4A3B14" text-anchor="middle">сертификат</text>
</g>

<!-- номер слева -->
<rect x="100" y="900" width="112" height="112" fill="#fff" stroke="#D8CFB8"/>
<g fill="#1B3A5C">
  <rect x="116" y="916" width="24" height="24"/><rect x="172" y="916" width="24" height="24"/><rect x="116" y="972" width="24" height="24"/>
  <rect x="148" y="948" width="16" height="16"/><rect x="180" y="980" width="16" height="16"/><rect x="148" y="980" width="16" height="16"/>
  <rect x="180" y="948" width="16" height="16"/>
</g>
<text class="mono" x="100" y="1042" font-size="20" fill="#1B3A5C">No. SAFE-2026-0001</text>
<text class="mono" x="100" y="1070" font-size="16" fill="#5B564A">проверка на risk-place.ru · SHA 4C81-B2E7-19AD</text>

<!-- дата по центру, ниже плашек и выше нижней рамки -->
<line x1="620" y1="940" x2="900" y2="940" stroke="#B8912F" stroke-width="1.2"/>
<rect x="753" y="933" width="13" height="13" transform="rotate(45 760 940)" fill="#B8912F"/>
<text x="760" y="984" font-size="23" fill="#1B3A5C" text-anchor="middle">выдан 15 августа 2026 года</text>
</svg>
